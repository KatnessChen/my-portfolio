name: CI

on:
  push:
  pull_request:
    branches: [main]

# A push to a branch that also has an open PR would otherwise run twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # A build can exit 0 having emitted nothing. Confirm the entry page is there.
      - name: Verify output
        run: test -f dist/index.html
